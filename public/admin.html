<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — RIOT Feedback Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem;">
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div style="width: 36px; height: 36px; background: #FF1A1A; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: white; font-size: 0.875rem;">R</div>
        <div>
          <h1 style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.25rem; color: white;">Feedback Admin</h1>
          <p style="font-size: 0.75rem; color: #666;">Walrus-native submissions</p>
        </div>
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <span class="badge badge-cyan" id="countBadge">0 submissions</span>
        <button class="btn-secondary" onclick="loadSubmissions()">Refresh</button>
        <button class="btn-secondary" onclick="exportCSV()">Export CSV</button>
        <a href="/index.html" class="btn-secondary" style="text-decoration: none;">Back to Form</a>
      </div>
    </div>

    <!-- Filters -->
    <div class="card" style="padding: 1rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
      <span style="font-size: 0.75rem; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Filter:</span>
      <button class="btn-secondary filter-btn btn-active" data-filter="all">All</button>
      <button class="btn-secondary filter-btn" data-filter="bug">Bugs</button>
      <button class="btn-secondary filter-btn" data-filter="feature">Features</button>
      <button class="btn-secondary filter-btn" data-filter="critical">Critical</button>
      <button class="btn-secondary filter-btn" data-filter="encrypted">Encrypted</button>
    </div>

    <!-- Table -->
    <div class="card" style="overflow: hidden;">
      <div class="table-row table-header" style="background: rgba(255,255,255,0.02);">
        <div>Project / Message</div>
        <div>Type</div>
        <div>Priority</div>
        <div>Status</div>
        <div>Date</div>
      </div>
      <div id="submissionsList">
        <div class="empty-state">
          <p style="font-size: 2rem; margin-bottom: 0.5rem;">📭</p>
          <p>No submissions yet.</p>
          <p style="font-size: 0.75rem; margin-top: 0.5rem;">Submit your first feedback via the form.</p>
        </div>
      </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; align-items: center; justify-content: center; padding: 1rem;">
      <div class="card" style="max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 2rem; position: relative;">
        <button onclick="closeModal()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: #666; font-size: 1.5rem; cursor: pointer;">×</button>
        <h2 style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: white; margin-bottom: 1.5rem;">Submission Detail</h2>
        <div id="modalContent" style="display: grid; gap: 1rem;"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Admin-specific init
    document.addEventListener('DOMContentLoaded', () => {
      loadSubmissions();
      setupFilters();
    });
  </script>
</body>
</html>
